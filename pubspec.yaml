name: facing_app
description: "WOD pacing strategy app"
publish_to: 'none'
version: 0.1.17+3000

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  provider: ^6.1.2
  connectivity_plus: ^6.0.5
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  wakelock_plus: ^1.2.8
  # /go Phase 3: SNS 공유 (WOD 결과 카드 텍스트 공유).
  share_plus: ^10.0.0
  # v1.19 P2: 공지 CTA 외부 링크 열기.
  url_launcher: ^6.3.1
  # PHASE5: 사장 폰 로그인 — 쿠키 세션 관리 + 보안 토큰 저장
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  flutter_secure_storage: ^9.2.2
  # v1.17 로컬 푸시 — Firebase 없는 자체 알림 (SSE + Foreground Service + 로컬 노티)
  flutter_local_notifications: ^17.2.3
  flutter_foreground_task: ^8.10.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 400
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/images/character/
    - assets/textures/
    - assets/icons/
    - assets/data/rehab/
